
services:
  backend:
    build:
      context: ./backend
    container_name: lyftr-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
      ENABLE_FAILURE_SIMULATION: "true"
    volumes:
      - lyftr_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: lyftr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lyftr_data:
